user www-data;
worker_processes 1;
pid /run/cf-workers-sub-nginx.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    server {
        listen 80 default_server;
        server_name sub.nvidias.top;
        location ^~ /.well-known/acme-challenge/ { root /var/lib/cf-workers-sub-acme; }
        location / { return 308 https://sub.nvidias.top$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name sub.nvidias.top;
        ssl_certificate /etc/cf-workers-sub/tls/fullchain.pem;
        ssl_certificate_key /etc/cf-workers-sub/tls/key.pem;
        ssl_session_cache shared:subscription:1m;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = / { return 302 https://sub.nvidias.top/admin; }
        location / {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Host sub.nvidias.top;
            proxy_set_header Connection "";
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
